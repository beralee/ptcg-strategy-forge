[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-strategy-forge"
version = "0.3.0"
description = "Standalone data-only PtcgDAP strategy developer toolkit"
requires-python = ">=3.13"
dependencies = ["cryptography==46.0.7", "jsonschema==4.26.0"]

[project.optional-dependencies]
model = ["numpy==2.3.3", "onnx==1.22.0", "onnxruntime==1.26.0"]

[project.scripts]
forge = "ptcg_strategy_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_strategy_forge*"]
